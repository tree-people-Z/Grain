<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grain</title>
<link rel="stylesheet" href="/fonts/noto-sans-sc/wght.css">
<link rel="stylesheet" href="/fonts/jetbrains-mono/400.css">
<link rel="stylesheet" href="/fonts/jetbrains-mono/500.css">
<link rel="stylesheet" href="/fonts/jetbrains-mono/700.css">
<link rel="stylesheet" href="/style.css?v=21">
</head>
<body>

<header class="toolbar pywebview-drag-region">
  <div class="brand">
    <span class="brand-mark"><i></i><i></i><i></i></span>
    <span class="brand-text">Grain</span>
  </div>
  <div class="toolbar-group">
    <button id="btn-open-project" class="btn ghost">项目库</button>
    <div class="select-wrap">
      <select id="project-select" title="当前项目"></select>
    </div>
  </div>
  <div class="toolbar-group">
    <button id="btn-detect" class="btn">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4"/><path d="m10.5 10.5 3 3"/></svg>
      检测
    </button>
    <button id="btn-roles" class="btn">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="5.5" r="2.5"/><path d="M2 13c0-2.2 1.8-4 4-4s4 1.8 4 4"/><circle cx="11.5" cy="6" r="2"/><path d="M11 9.2c1.8.2 3 1.6 3 3.3"/></svg>
      角色
    </button>
    <button id="btn-export" class="btn">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v8m0 0 3-3m-3 3L5 8M3 13h10" transform="rotate(180 8 8)"/></svg>
      导出
    </button>
  </div>
  <span class="spacer"></span>
  <span id="detect-status" class="status"></span>

  <div class="toolbar-group tools">
    <button id="btn-theme" class="btn icon" title="切换深色 / 浅色">
      <svg class="ico-sun" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.4v1.6M8 13v1.6M14.6 8H13M3 8H1.4M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1M12.5 12.5l-1.1-1.1M4.6 4.6L3.5 3.5"/></svg>
      <svg class="ico-moon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 9.6A5.6 5.6 0 0 1 6.4 2.6a5.6 5.6 0 1 0 7 7z"/></svg>
    </button>
    <button id="btn-settings" class="btn icon" title="设置">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.1"/><path d="M12.9 9.7a1.1 1.1 0 0 0 .22 1.21l.04.04a1.33 1.33 0 1 1-1.88 1.88l-.04-.04a1.1 1.1 0 0 0-1.21-.22 1.1 1.1 0 0 0-.67 1v.11a1.33 1.33 0 1 1-2.66 0v-.06a1.1 1.1 0 0 0-.72-1.01 1.1 1.1 0 0 0-1.21.22l-.04.04a1.33 1.33 0 1 1-1.88-1.88l.04-.04a1.1 1.1 0 0 0 .22-1.21 1.1 1.1 0 0 0-1-.67h-.11a1.33 1.33 0 1 1 0-2.66h.06a1.1 1.1 0 0 0 1.01-.72 1.1 1.1 0 0 0-.22-1.21l-.04-.04a1.33 1.33 0 1 1 1.88-1.88l.04.04a1.1 1.1 0 0 0 1.21.22h.05a1.1 1.1 0 0 0 .67-1v-.11a1.33 1.33 0 1 1 2.66 0v.06a1.1 1.1 0 0 0 .67 1.01 1.1 1.1 0 0 0 1.21-.22l.04-.04a1.33 1.33 0 1 1 1.88 1.88l-.04.04a1.1 1.1 0 0 0-.22 1.21v.05a1.1 1.1 0 0 0 1 .67h.11a1.33 1.33 0 1 1 0 2.66h-.06a1.1 1.1 0 0 0-1.01.67z"/></svg>
    </button>
  </div>

  <div id="win-controls" class="win-controls">
    <button id="win-min" class="win-btn" title="最小化" aria-label="最小化">
      <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.5 6h7"/></svg>
    </button>
    <button id="win-max" class="win-btn" title="最大化 / 还原" aria-label="最大化 / 还原">
      <svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.5" y="2.5" width="7" height="7" rx="1.6"/></svg>
    </button>
    <button id="win-close" class="win-btn close" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>
    </button>
  </div>
</header>

<main id="stage" class="empty"></main>

<template id="workspace-template">
  <div class="workspace">

    <section class="panel media-panel">
      <div class="panel-head">
        <span class="kicker k-media"></span><span class="panel-title">媒体</span>
        <span class="spacer"></span>
        <button id="btn-play" class="btn icon" title="播放 / 暂停（空格）">▶</button>
        <span id="time-display" class="mono timecode">00:00 / 00:00</span>
      </div>
      <div class="media-stage">
        <div id="media-host" class="media-host"></div>
        <div id="video-overlay" class="video-overlay">
          <div id="overlay-text" class="overlay-text"></div>
          <div id="overlay-translation" class="overlay-translation"></div>
        </div>
      </div>
      <div id="media-resizer" class="media-resizer" title="拖动调整视频 / 时间轴高度"></div>
    </section>

    <aside class="panel side-panel">
      <div class="panel-head">
        <span class="kicker k-current"></span><span class="panel-title">角色与进度</span>
      </div>
      <div class="side-body">
        <div id="role-summary" class="role-summary"></div>
        <div class="side-group">
          <div class="side-group-title">检测结果</div>
          <div id="detect-summary" class="detect-summary"></div>
        </div>
      </div>
    </aside>

    <section class="panel track-panel">
      <div class="panel-head">
        <span class="kicker k-track"></span><span class="panel-title">字幕播放条</span>
        <span class="head-hint">拖动标尺定位 · 滚轮平移 · Alt+滚轮缩放</span>
        <span class="spacer"></span>
        <label class="toggle"><input type="checkbox" id="chk-follow" checked><i></i>跟随播放</label>
        <span class="vr"></span>
        <button id="btn-zoom-fit" class="btn ghost sm" title="缩放到完整时长">适配</button>
        <button id="btn-zoom-out" class="btn icon sm" title="缩小">−</button>
        <span id="zoom-label" class="mono zoom">1.0×</span>
        <button id="btn-zoom-in" class="btn icon sm" title="放大">+</button>
      </div>
      <div class="track-outer">
        <div id="track" class="track">
          <canvas id="ruler" class="ruler"></canvas>
          <div id="lanes" class="track-lanes"></div>
          <div class="track-main">
            <canvas id="waveform" class="waveform"></canvas>
            <div id="track-blocks" class="track-blocks"></div>
          </div>
          <div id="playhead" class="playhead"></div>
        </div>
      </div>
      <div class="track-meta">
        <span id="track-position" class="mono">0.00s → 0.00s</span>
      </div>
    </section>

    <section class="panel cue-panel">
      <div class="cue-bar">
        <div class="cue-main">
          <div class="cue-head">
            <span id="current-range" class="mono current-range"></span>
            <span id="current-badge" class="badge"></span>
          </div>
          <div id="current-text" class="current-text">—</div>
          <div id="current-translation" class="current-translation" hidden></div>
        </div>
        <div class="cue-assign">
          <div class="assign-head">
            <span class="assign-label">归属人物</span>
            <span class="hint">点击即归属 · 1-9 / 0</span>
          </div>
          <div id="speaker-buttons" class="speaker-buttons"></div>
        </div>
      </div>
    </section>

    <section class="panel queue-panel">
      <div class="panel-head">
        <span class="kicker k-queue"></span><span class="panel-title">字幕清单</span>
        <div class="filters">
          <button class="chip active" data-filter="all">全部</button>
          <button class="chip" data-filter="pending">待定</button>
          <button class="chip" data-filter="manual">已复核</button>
          <button class="chip" data-filter="low">低置信度</button>
        </div>
        <span class="spacer"></span>
        <div class="lang-seg" id="lang-toggle" hidden>
          <button data-lang="primary">原文</button>
          <button data-lang="both" class="active">双语</button>
          <button data-lang="translation">译文</button>
        </div>
        <input id="search" class="search" type="text" placeholder="搜索字幕文本…">
      </div>
      <div id="queue" class="queue"></div>
    </section>

  </div>
</template>

<div id="modal-root"></div>

<footer class="statusbar">
  <span class="stat"><i class="dot total"></i><b id="stat-total">0</b> 字幕</span>
  <span class="stat"><i class="dot assigned"></i><b id="stat-assigned">0</b> 已归属</span>
  <span class="stat"><i class="dot pending"></i><b id="stat-pending">0</b> 待定</span>
  <span class="stat"><i class="dot roles"></i><b id="stat-roles">0</b> 角色</span>
  <span class="stat"><i class="dot progress"></i><b id="stat-progress">0%</b> 进度</span>
  <span class="spacer"></span>
  <span id="stat-message" class="hint"></span>
</footer>

<script src="/app.js?v=28"></script>
</body>
</html>
