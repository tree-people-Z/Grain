<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grain</title>
<link rel="stylesheet" href="/fonts/noto-sans-sc/wght.css">
<link rel="stylesheet" href="/fonts/jetbrains-mono/400.css">
<link rel="stylesheet" href="/fonts/jetbrains-mono/500.css">
<link rel="stylesheet" href="/fonts/jetbrains-mono/700.css">
<link rel="stylesheet" href="/style.css?v=29">
</head>
<body>

<header class="toolbar">
  <div class="brand">
    <span class="brand-mark"><i></i><i></i><i></i></span>
    <span class="brand-text">Grain</span>
  </div>
  <div class="toolbar-group">
    <div class="select-wrap">
      <select id="project-select" title="当前项目"></select>
    </div>
  </div>
  <div class="toolbar-group">
    <button id="btn-import" class="btn" title="导入下一个项目">＋ 导入</button>
    <button id="btn-init" class="btn" title="清空所有项目，重新开始">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.5"/><path d="M13 2v3h-3"/></svg>
      初始化
    </button>
    <button id="btn-detect" class="btn">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4"/><path d="m10.5 10.5 3 3"/></svg>
      检测
    </button>
    <button id="btn-export" class="btn">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v8m0 0 3-3m-3 3L5 8M3 13h10" transform="rotate(180 8 8)"/></svg>
      导出
    </button>
  </div>
  <span class="spacer"></span>
  <span id="detect-status" class="status"></span>
</header>

<main id="stage" class="empty"></main>

<template id="workspace-template">
  <div class="workspace">

    <div class="mobile-panels" role="group" aria-label="工作区面板">
      <button type="button" data-panel="queue" class="active">字幕清单</button>
      <button type="button" data-panel="side">角色与检测</button>
    </div>

    <section class="panel media-panel">
      <div class="panel-head">
        <span class="kicker k-media"></span><span class="panel-title">媒体</span>
        <span class="spacer"></span>
        <button id="btn-play" class="btn icon" title="播放 / 暂停（空格）">▶</button>
        <span id="time-display" class="mono timecode">00:00 / 00:00</span>
      </div>
      <div class="media-stage">
        <div id="media-host" class="media-host"></div>
        <div id="video-overlay" class="video-overlay">
          <div id="overlay-text" class="overlay-text"></div>
        </div>
      </div>
      <div id="media-resizer" class="media-resizer" title="拖动调整视频 / 时间轴高度"></div>
    </section>

    <aside class="panel side-panel">
      <div class="panel-head">
        <span class="kicker k-current"></span><span class="panel-title">角色与检测</span>
        <span class="spacer"></span>
        <button id="btn-manage-roles" class="btn ghost sm">管理</button>
      </div>
      <div class="side-body">
        <div id="role-summary" class="role-summary"></div>
        <div class="side-group">
          <div class="side-group-title">检测</div>
          <div id="detect-summary" class="detect-summary"></div>
        </div>
      </div>
    </aside>

    <section class="panel track-panel">
      <div class="panel-head">
        <span class="kicker k-track"></span><span class="panel-title">字幕播放条</span>
        <span class="head-hint">拖动标尺定位 · 滚轮平移 · Alt+滚轮缩放</span>
        <span class="spacer"></span>
        <label class="toggle"><input type="checkbox" id="chk-follow" checked><i></i>跟随播放</label>
        <span class="vr"></span>
        <button id="btn-zoom-out" class="btn icon sm" title="缩小">−</button>
        <button id="zoom-label" class="mono zoom zoom-fit" title="点击缩放到完整时长">1.0×</button>
        <button id="btn-zoom-in" class="btn icon sm" title="放大">+</button>
      </div>
      <div class="track-outer">
        <div id="track" class="track">
          <canvas id="ruler" class="ruler"></canvas>
          <div id="lanes" class="track-lanes"></div>
          <div class="track-main">
            <canvas id="waveform" class="waveform"></canvas>
            <div id="track-blocks" class="track-blocks"></div>
          </div>
          <div id="playhead" class="playhead"></div>
        </div>
      </div>
      <div class="cue-bar">
        <div class="cue-main">
          <div class="cue-head">
            <span id="current-range" class="mono current-range"></span>
            <span id="current-badge" class="badge"></span>
          </div>
          <div id="current-text" class="current-text">—</div>
        </div>
        <div class="cue-assign">
          <div class="assign-head">
            <span class="assign-label">归属人物</span>
            <span class="spacer"></span>
            <label class="toggle sm"><input type="checkbox" id="chk-autonext"><i></i>归后跳下句</label>
            <span class="hint">点击即归属 · 1-9 / 0</span>
          </div>
          <div id="speaker-buttons" class="speaker-buttons"></div>
        </div>
      </div>
      <div class="track-meta">
        <span id="track-position" class="mono">0.00s → 0.00s</span>
      </div>
    </section>

    <section class="panel queue-panel">
      <div class="panel-head">
        <span class="kicker k-queue"></span><span class="panel-title">字幕清单</span>
        <span class="spacer"></span>
        <span id="queue-count" class="mono queue-count"></span>
      </div>
      <div id="queue-filters" class="queue-filters" role="group" aria-label="筛选字幕">
        <button type="button" data-filter="all" class="active">全部</button>
        <button type="button" data-filter="pending">待定</button>
        <button type="button" data-filter="review">需复核</button>
        <button type="button" data-filter="manual">已复核</button>
      </div>
      <div id="queue" class="queue"></div>
    </section>

  </div>
</template>

<div id="modal-root"></div>

<footer class="statusbar">
  <span class="stat"><i class="dot total"></i><b id="stat-total">0</b> 字幕</span>
  <span class="stat"><i class="dot assigned"></i><b id="stat-assigned">0</b> 已归属</span>
  <span class="stat"><i class="dot manual"></i><b id="stat-reviewed">0</b> 已复核</span>
  <span class="stat"><i class="dot pending"></i><b id="stat-pending">0</b> 待定</span>
  <span class="spacer"></span>
  <span id="stat-message" class="hint"></span>
</footer>

<script src="/app.js?v=45"></script>
</body>
</html>
